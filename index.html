<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rescata a la Universidad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una sola columna centrada tipo tarjeta de juego; barra de progreso por nivel arriba, reto al centro, opciones como botones grandes táctiles. */
:root {
  --bg: #F4F8F3;
  --surface: #FFFFFF;
  --ink: #17231A;
  --muted: #5B6B5E;
  --line: #DCE6DA;
  --green: #07B708;
  --green-deep: #057A0A;
  --green-soft: #E3F6E3;
  --violet: #5B2BC4;
  --violet-soft: #EEE8FB;
  --ok: #0E8F4A;
  --ok-soft: #DDF5E7;
  --bad: #C62E2E;
  --bad-soft: #FBE3E3;
  --f-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "Work Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1611; --surface: #18221B; --ink: #E8F0E9; --muted: #9DB0A1; --line: #2A3A2E;
  --green: #22C93A; --green-deep: #5FE070; --green-soft: #1B3320; --violet: #B79BFF; --violet-soft: #2A2340;
  --ok: #4ADE80; --ok-soft: #173524; --bad: #FF7B7B; --bad-soft: #3A1E1E; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1611; --surface: #18221B; --ink: #E8F0E9; --muted: #9DB0A1; --line: #2A3A2E;
  --green: #22C93A; --green-deep: #5FE070; --green-soft: #1B3320; --violet: #B79BFF; --violet-soft: #2A2340;
  --ok: #4ADE80; --ok-soft: #173524; --bad: #FF7B7B; --bad-soft: #3A1E1E; color-scheme: dark }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brandrow { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 104px; height: auto; background: #FFFFFF; border-radius: 10px; padding: 4px 6px; flex: none; }
.badge { font-family: var(--f-display); font-weight: 700; font-size: .95rem; background: var(--green); color: #06260A; border-radius: 999px; padding: 4px 14px; }
.howto { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.howto li { display: flex; gap: 12px; align-items: flex-start; }
.howto li::before { counter-increment: s; content: counter(s); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #06260A; font-family: var(--f-display); font-weight: 700; display: grid; place-items: center; font-size: .9rem; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--green-deep); letter-spacing: .01em; }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .78rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.score { display: flex; gap: 8px; }
.chip { font-family: var(--f-display); font-weight: 600; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { color: var(--green-deep); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: clamp(1.7rem, 6vw, 2.3rem); }
h2 { font-size: clamp(1.3rem, 4.6vw, 1.6rem); }
p { margin: 0; }
.lead { color: var(--muted); }
.eyebrow { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--violet); }

.alarm { background: var(--bad-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.alarm strong { color: var(--bad); font-family: var(--f-display); }
.alarm ul { margin: 0; padding-left: 18px; }

.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lv { border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: .85rem; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lv span { font-family: var(--f-display); font-weight: 600; color: var(--green-deep); }
@media (max-width: 460px) { .levels { grid-template-columns: 1fr; } }

label { font-weight: 600; font-size: .92rem; }
input[type=text] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input[type=text]:focus { outline: 3px solid var(--green-soft); border-color: var(--green); }

.btn { font-family: var(--f-display); font-weight: 600; font-size: 1rem; border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer; background: var(--green); color: #06260A; min-height: 48px; }
.btn:hover { filter: brightness(1.05); }
.btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

.progress { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--green); width: 0; transition: width .3s ease; }
.lvhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lvhead .eyebrow { color: var(--violet); }
.count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.piece { align-self: center; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.3rem, 5vw, 1.7rem); background: var(--violet-soft); color: var(--violet); border-radius: 14px; padding: 18px 20px; width: 100%; }
.piece small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .9rem; color: var(--muted); margin-top: 4px; }
.prompt { font-weight: 600; }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opts.one { grid-template-columns: 1fr; }
@media (max-width: 420px) { .opts { grid-template-columns: 1fr; } }
.opt { font: inherit; text-align: left; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 56px; min-width: 0; }
.opt:hover:not([disabled]) { border-color: var(--green); }
.opt svg { flex: none; width: 44px; height: 30px; }
.opt .t { display: flex; flex-direction: column; min-width: 0; }
.opt .t b { font-family: var(--f-display); font-weight: 600; }
.opt .t span { font-size: .85rem; color: var(--muted); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: .9rem; }

.fb { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.fb.ok { background: var(--ok-soft); }
.fb.no { background: var(--bad-soft); }
.fb strong { font-family: var(--f-display); }
.fb.ok strong { color: var(--ok); }
.fb.no strong { color: var(--bad); }

.result { text-align: center; align-items: center; }
.medal { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 2.1rem; font-variant-numeric: tabular-nums; }
.medal.gold { background: var(--green-soft); color: var(--green-deep); border: 4px solid var(--green); }
.medal.mid { background: var(--violet-soft); color: var(--violet); border: 4px solid var(--violet); }
.medal.low { background: var(--bad-soft); color: var(--bad); border: 4px solid var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .8rem; color: var(--muted); }
.cert { width: 100%; border: 1.5px dashed var(--green); border-radius: 12px; padding: 12px; font-size: .9rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
footer { text-align: center; font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>
</head>

function levelIntro() {
  const L = LEVELS[S.lv];
  app.innerHTML = `<span class="eyebrow">${L.tag} de 3</span><h2>${L.name}</h2><p class="lead">${L.intro}</p>
    <button class="btn" id="go">Empezar ${L.tag.toLowerCase()}</button>`;
  $("#go").addEventListener("click", () => { S.i = 0; question(); });
  $("#go").focus();
}

function question() {
  const L = LEVELS[S.lv], it = L.items[S.i];
  S.answered = false;
  const done = LEVELS.slice(0, S.lv).reduce((n, l) => n + l.items.length, 0) + S.i;
  let body = "";
  if (S.lv === 0) {
    body = `<div class="piece">${esc(it.q)}<small>${esc(it.sub)}</small></div><p class="prompt">¿Qué es esto dentro del diagrama de flujo de datos (DFD)?</p>
      <div class="opts">${SYMOPTS.map((o, n) => `<button class="opt" data-n="${o.k}">${SYM[o.k]}<span class="t"><b>${o.b}</b><span>${o.s}</span></span></button>`).join("")}</div>`;
  } else if (S.lv === 1) {
    body = `<div class="piece"><span class="mono">${esc(it.q)}</span><small>${esc(it.sub)}</small></div><p class="prompt">¿Cómo debe definirse este dato? (tipo · longitud · regla)</p>
      <div class="opts one">${it.opts.map((o, n) => `<button class="opt" data-n="${n}"><span class="t"><b>${esc(o)}</b></span></button>`).join("")}</div>`;
  } else {
    body = `<div class="piece" style="font-size:clamp(1.05rem,4.2vw,1.3rem)">${esc(it.q)}</div><p class="prompt">¿Qué tipo de regla es?</p>
      <div class="opts one">${L.opts.map((o, n) => `<button class="opt" data-n="${n}"><span class="t"><b>${o.b}</b><span>${o.s}</span></span></button>`).join("")}</div>`;
  }
  app.innerHTML = `<div class="lvhead"><span class="eyebrow">${L.tag} · ${L.name}</span><span class="count">Pregunta ${S.i + 1} de ${L.items.length}</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${(done / TOTAL) * 100}%"></i></div>${body}<div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(b)));
}

function answer(btn) {
  if (S.answered) return;
  S.answered = true;
  const L = LEVELS[S.lv], it = L.items[S.i];
  const pick = S.lv === 0 ? btn.dataset.n : Number(btn.dataset.n);
  const ok = pick === it.a;
  app.querySelectorAll(".opt").forEach((b) => {
    const v = S.lv === 0 ? b.dataset.n : Number(b.dataset.n);
    if (v === it.a) b.classList.add("right");
    b.disabled = true;
  });
  if (!ok) btn.classList.add("wrong");
  if (ok) { S.pts += 10; S.hits[S.lv]++; setPts(); }
  const last = S.i === L.items.length - 1;
  const nextLabel = last ? (S.lv === LEVELS.length - 1 ? "Ver resultado" : "Siguiente nivel") : "Siguiente";
  $("#fb").innerHTML = `<div class="fb ${ok ? "ok" : "no"}" role="status"><strong>${ok ? "¡Correcto! +10" : "Incorrecto"}</strong><span>${it.why}</span></div>
    <button class="btn" id="nx" style="margin-top:12px;width:100%">${nextLabel}</button>`;
  $("#nx").addEventListener("click", () => {
    if (!last) { S.i++; question(); }
    else if (S.lv < LEVELS.length - 1) { S.lv++; levelIntro(); }
    else finish();
  });
  $("#nx").focus();
}

function finish() {
  S.t1 = Date.now(); tick(); clearInterval(S.timer);
  const hits = S.hits.reduce((a, b) => a + b, 0), pct = hits / TOTAL;
  const [cls, title, msg] = pct >= 0.84 ? ["gold", "¡Universidad rescatada!", "Tu análisis encontró dónde se rompía el flujo de datos. El sistema ya puede funcionar."]
    : pct >= 0.58 ? ["mid", "Rescate parcial", "Corregiste buena parte del sistema, pero todavía hay datos que se pueden perder. Repasa los niveles con más errores."]
    : ["low", "Sistema en riesgo", "El sistema sigue fallando. Revisa la simbología del DFD, el diccionario de datos y los tipos de reglas, y vuelve a intentarlo."];
  const today = new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  app.innerHTML = `<div class="card result" style="border:0;padding:0">
    <div class="medal ${cls}">${hits}/${TOTAL}</div>
    <h2>${title}</h2><p class="lead">${msg}</p>
    <div class="stats">${LEVELS.map((l, n) => `<div class="stat"><b>${S.hits[n]}/${l.items.length}</b><span>${l.name}</span></div>`).join("")}</div>
    <div class="cert"><b>${esc(S.name)}</b> · ${S.pts} puntos · Tiempo ${fmt(S.t1 - S.t0)} · ${today}<br>Semana 3 · Docente: Dr. Armando Maravilla</div>
    <p class="lead" style="font-size:.9rem">Toma una captura de esta pantalla y súbela al Padlet de la clase.</p>
    <div class="row"><button class="btn" id="again">Jugar de nuevo</button></div></div>`;
  $("#again").addEventListener("click", home);
}

home();
</script>

</body>
</html>
